[project]
name = "django-api-backend"
version = "0.1.0"
description = "Django + DRF API backend starter with allauth, Stripe, and OpenAPI"
requires-python = ">=3.12"
dependencies = [
    "django==5.1.7",
    "djangorestframework==3.15.2",
    "django-allauth==65.4.1",
    "drf-spectacular==0.28.0",
    "stripe==11.4.1",
    "psycopg[binary]==3.2.4",
    "django-cors-headers==4.6.0",
    "django-ratelimit==4.1.0",
    "structlog==24.4.0",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "hypothesis==6.119.3",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "django-stubs==5.1.1",
    "djangorestframework-stubs==3.15.1",
    "factory-boy==3.3.1",
    "httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unreachable = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
