[project]
name = "fastapi-data-platform"
version = "0.1.0"
description = "FastAPI data platform with ingestion, ETL, and analytics using PostgreSQL, DuckDB, S3, and Celery"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.1",
    "redis==5.2.1",
    "celery[redis]==5.4.0",
    "duckdb==1.1.3",
    "boto3==1.35.86",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.20",
    "pydantic-settings==2.7.1",
    "structlog==24.4.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
