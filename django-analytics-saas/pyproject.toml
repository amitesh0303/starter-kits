[project]
name = "django-analytics-saas"
version = "0.1.0"
description = "Django analytics and reporting SaaS with Celery, Redis, and Stripe"
requires-python = ">=3.11"
dependencies = [
    "django==5.1.7",
    "djangorestframework==3.15.2",
    "django-allauth==65.4.1",
    "stripe==11.4.1",
    "psycopg[binary]==3.2.4",
    "celery==5.4.0",
    "redis==5.2.1",
    "django-cors-headers==4.6.0",
    "structlog==24.4.0",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "hypothesis==6.119.3",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "django-stubs==5.1.1",
    "factory-boy==3.3.1",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
strict = true

[[tool.mypy.overrides]]
module = ["allauth.*", "celery.*", "redis.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
